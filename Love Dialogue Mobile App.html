<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Can We Hug? - Interactive Love Dialogue</title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        roseSoft: '#FFF5F7',
                        roseAccent: '#FF4D6D',
                        roseDark: '#C9184A',
                        ink: '#1E1B24',
                        mutedInk: '#6E6A7C'
                    },
                    boxShadow: {
                        'card': '0 20px 50px -12px rgba(24, 24, 27, 0.08), 0 0 1px 1px rgba(24, 24, 27, 0.04)',
                        'bubble': '0 8px 24px -4px rgba(24, 24, 27, 0.06), 0 2px 6px -1px rgba(24, 24, 27, 0.03)',
                        'bubble-hover': '0 14px 30px -4px rgba(255, 77, 109, 0.16), 0 4px 10px -1px rgba(255, 77, 109, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for crisp speech bubble tails & smooth animations */
        body {
            background-color: #FFFFFF;
            color: #1E1B24;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Top Speech Bubble Tail (pointing down toward character) */
        .bubble-down {
            position: relative;
            background: #FFFFFF;
            border: 1.5px solid #F1F1F5;
            border-radius: 22px;
        }
        .bubble-down::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #F1F1F5 transparent transparent transparent;
        }
        .bubble-down::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 9px 9px 0;
            border-style: solid;
            border-color: #FFFFFF transparent transparent transparent;
        }

        /* Option Speech Bubble Tail (pointing up toward character thumbnail) */
        .bubble-up {
            position: relative;
            background: #FFFFFF;
            border: 1.5px solid #EFEFF4;
            border-radius: 18px;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .bubble-up::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px;
            border-style: solid;
            border-color: transparent transparent #EFEFF4 transparent;
            transition: border-color 0.25s ease;
        }
        .bubble-up::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 7px 7px;
            border-style: solid;
            border-color: transparent transparent #FFFFFF transparent;
            transition: border-color 0.25s ease;
        }

        /* Hover & Active states for option cards */
        .option-card:hover .bubble-up,
        .option-card:active .bubble-up {
            border-color: #FFCCD5;
            background-color: #FFF9FA;
        }
        .option-card:hover .bubble-up::before,
        .option-card:active .bubble-up::before {
            border-color: transparent transparent #FFCCD5 transparent;
        }
        .option-card:hover .bubble-up::after,
        .option-card:active .bubble-up::after {
            border-color: transparent transparent #FFF9FA transparent;
        }

        /* Slide transitions */
        .slide-view {
            transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1), transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .slide-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px) scale(0.98);
            position: absolute;
            inset: 0;
        }
        .slide-active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
            position: relative;
        }

        /* Gentle floating animation for main character */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: gentleFloat 3.4s ease-in-out infinite;
        }

        /* Pop-in animation for speech bubbles */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.88) translateY(8px); }
            70% { opacity: 1; transform: scale(1.03) translateY(-1px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Floating hearts in celebration modal */
        @keyframes heartRise {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.6) rotate(-8deg);
            }
            25% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(-90px) scale(1.15) rotate(12deg);
            }
        }
        .floating-heart {
            position: absolute;
            animation: heartRise 2.8s ease-out infinite;
            pointer-events: none;
        }

        /* Custom Slider Track & Thumb */
        .slider-track {
            touch-action: none;
            user-select: none;
        }
    </style>
</head>
<body class="min-h-screen bg-white sm:bg-zinc-50/70 flex items-center justify-center p-0 sm:p-4 antialiased">

    <!-- Mobile App Container -->
    <main class="w-full max-w-[420px] min-h-[100dvh] sm:min-h-[740px] sm:h-[760px] bg-white sm:rounded-[38px] sm:shadow-card sm:border sm:border-zinc-100 flex flex-col justify-between relative overflow-hidden">
        
        <!-- Subtle Top Header / Progress Indicator -->
        <header class="w-full pt-5 px-6 pb-2 flex items-center justify-between z-10">

                <span id="dot-3" class="h-1.5 w-2 rounded-full bg-zinc-200 transition-all duration-300"></span>

            </div>
            <button onclick="resetApp()" id="header-reset-btn" class="text-xs font-medium text-zinc-400 hover:text-roseAccent transition-colors px-2 py-1 rounded-full opacity-0 pointer-events-none">

        <!-- Dynamic Slides Stage -->
        <div class="flex-1 relative flex flex-col justify-center px-6 py-2 overflow-hidden">

            <!-- ==================== SLIDE 1: CHARACTER INTRODUCTION ==================== -->
            <section id="slide-1" class="slide-view slide-active flex flex-col items-center justify-between h-full py-2">
                
                <!-- Intro Header Badge -->
                <div class="mt-1">
                    <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-roseSoft text-roseDark text-xs font-bold tracking-wide uppercase">

                <!-- Two Character Introduction Cards with Speech Bubbles -->
                <div class="w-full flex flex-col gap-4 my-auto">
                    
                    <!-- Character 1: Ahinsaka Dilaccana -->

                                src="https://i.postimg.cc/8z850QWC/AIRetouch-20261118-160545159.png" 
                                alt="Ahinsaka Dilaccana"

                            <div class="relative bg-white border-[1.5px] border-zinc-100 rounded-2xl px-4 py-3 shadow-bubble">

                    </div>

                    <!-- Character 2: Napuru Chamacca -->

                </div>

                <!-- Continue Button -->

                        type="button"

                        class="w-full py-3.5 px-6 rounded-2xl bg-roseAccent hover:bg-roseDark text-white font-bold text-[15px] shadow-lg shadow-roseAccent/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 focus:outline-none">

            <!-- ==================== SLIDE 2: INITIAL QUESTION ==================== -->

                        <div class="w-24 h-24 sm:w-28 sm:h-28 mb-2.5 flex items-center justify-center">
                            <img 
                                src="https://i.postimg.cc/bvgwrZ5q/AIRetouch-20261118-160716721.png" 
                                alt="Can't"

                                onerror="this.src='https://placehold.co/200x200/F4F4F5/71717A?text=Can%27t'"
                            >
                        </div>
                        <div class="bubble-up shadow-bubble w-full py-2.5 px-3 text-center">

                    <!-- Option B: "Yess we can." -->

                        <div class="w-24 h-24 sm:w-28 sm:h-28 mb-2.5 flex items-center justify-center">
                            <img 
                                src="https://i.postimg.cc/fLkDbBmL/AIRetouch-20261118-160729286.png" 
                                alt="Yess we can."

                                onerror="this.src='https://placehold.co/200x200/FFF5F7/FF4D6D?text=Yess+we+can.'"
                            >
                        </div>
                        <div class="bubble-up shadow-bubble w-full py-2.5 px-3 text-center">
                            <span class="text-[15px] font-semibold text-ink group-hover:text-roseDark transition-colors">
                                Yess we can.
                            </span>
                        </div>
                    </button>

            </section>

            <!-- ==================== SLIDE 3: WHYYY? ==================== -->
            <section id="slide-3" class="slide-view slide-hidden flex flex-col items-center justify-between h-full py-2">
                
                <!-- Top Character & Speech Bubble -->
                <div class="flex flex-col items-center w-full mt-2">
                    <div class="bubble-down shadow-bubble px-7 py-3.5 mb-4">

                            Whyyy?

            <!-- ==================== SLIDE 4: INTERACTIVE HUGGING SLIDE ==================== -->

        <!-- ==================== HUGGING CELEBRATION POP-UP MODAL ==================== -->
        <div id="hug-modal" class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-zinc-900/35 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="hug-modal-card" class="relative w-full max-w-[360px] bg-white rounded-[32px] p-6 shadow-2xl border border-rose-100 flex flex-col items-center text-center transform scale-90 transition-transform duration-300">

                <!-- Top Celebration Speech Bubble -->
                <div class="bubble-down shadow-bubble px-6 py-3 mb-4 bg-roseSoft/50 border-rose-100">
                    <p class="text-[18px] font-extrabold text-roseDark tracking-tight">
                        Warmest Hug Ever!
                    </p>
                </div>

                <!-- Final Hugging Image -->
                <div class="w-56 h-56 sm:w-60 sm:h-60 my-1 flex items-center justify-center">
                    <img 
                        src="https://i.postimg.cc/26HMXZHX/AIRetouch-20261118-162451824.png" 
                        alt="Hugging together" 
                        class="w-full h-full object-contain drop-shadow-md"
                        onerror="this.src='https://placehold.co/320x320/FFF5F7/FF4D6D?text=Warm+Hug!'"
                    >
                </div>

                <!-- Sweet Sub-caption -->
                <p class="text-xs font-medium text-mutedInk mt-2 mb-5">
                    Sending you all the love in the world.
                </p>

                <!-- Replay Button -->
                <button 
                    type="button"
                    onclick="resetApp()" 
                    class="w-full py-3.5 px-6 rounded-2xl bg-roseAccent hover:bg-roseDark text-white font-semibold text-sm shadow-lg shadow-roseAccent/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                    <span>Hug Again</span>
                </button>
            </div>
        </div>

    </main>

    <script>
        // State variables
        let currentSlide = 1;
        let hugCompleted = false;
        let isDragging = false;
        let currentProgress = 0; // 0 to 1 (0 = far right, 1 = next to boy on left)

        // DOM Elements
        const slides = {
            1: document.getElementById('slide-1'),
            2: document.getElementById('slide-2'),
            3: document.getElementById('slide-3'),
            4: document.getElementById('slide-4')
        };
        const dots = {
            1: document.getElementById('dot-1'),
            2: document.getElementById('dot-2'),
            3: document.getElementById('dot-3'),
            4: document.getElementById('dot-4')
        };
        const headerResetBtn = document.getElementById('header-reset-btn');
        const sliderTrack = document.getElementById('slider-track');
        const sliderThumb = document.getElementById('slider-thumb');
        const sliderFill = document.getElementById('slider-fill');
        const sliderHint = document.getElementById('slider-hint');
        const girlCharacter = document.getElementById('girl-character');
        const boyCharacter = document.getElementById('boy-character');
        const hugStage = document.getElementById('hug-stage');
        const hugPercent = document.getElementById('hug-percent');
        const distanceHeart = document.getElementById('distance-heart');
        const hugModal = document.getElementById('hug-modal');
        const hugModalCard = document.getElementById('hug-modal-card');
        const heartsContainer = document.getElementById('hearts-container');

        /**
         * Navigate smoothly between slides
         */
        function goToSlide(slideNumber) {
            currentSlide = slideNumber;

            // Update slide visibility classes
            Object.keys(slides).forEach((key) => {
                const num = parseInt(key, 10);
                if (num === slideNumber) {
                    slides[num].classList.remove('slide-hidden');
                    slides[num].classList.add('slide-active');
                } else {
                    slides[num].classList.remove('slide-active');
                    slides[num].classList.add('slide-hidden');
                }
            });

            // Update progress dots in header
            Object.keys(dots).forEach((key) => {
                const num = parseInt(key, 10);
                if (num === slideNumber) {
                    dots[num].classList.remove('w-2', 'bg-zinc-200');
                    dots[num].classList.add('w-6', 'bg-roseAccent');
                } else {
                    dots[num].classList.remove('w-6', 'bg-roseAccent');
                    dots[num].classList.add('w-2', 'bg-zinc-200');
                }
            });

            // Show subtle restart button when past Slide 1
            if (slideNumber > 1) {
                headerResetBtn.classList.remove('opacity-0', 'pointer-events-none');
                headerResetBtn.classList.add('opacity-100');
            } else {
                headerResetBtn.classList.add('opacity-0', 'pointer-events-none');
                headerResetBtn.classList.remove('opacity-100');
            }

            // Reset slider position whenever entering Slide 4
            if (slideNumber === 4) {
                resetSliderState();
            }
        }

        /**
         * Reset the interactive slider & girl position on Slide 3
         */
        function resetSliderState() {
            hugCompleted = false;
            isDragging = false;
            currentProgress = 0;
            updateSliderVisuals(0);
        }

        /**
         * Update thumb position, girl position, and progress indicator
         * @param {number} progress - Value between 0 (start on right) and 1 (hug on left)
         */
        function updateSliderVisuals(progress) {
            currentProgress = Math.max(0, Math.min(1, progress));

            const trackRect = sliderTrack.getBoundingClientRect();
            const thumbWidth = sliderThumb.offsetWidth;
            const padding = 6; // matches p-1.5 (6px)
            const maxThumbTravel = trackRect.width - thumbWidth - (padding * 2);

            // Thumb starts on the right (offset = 0) and moves left as progress increases
            const thumbOffset = currentProgress * maxThumbTravel;
            sliderThumb.style.transform = `translateX(-${thumbOffset}px)`;
            sliderThumb.setAttribute('aria-valuenow', Math.round(currentProgress * 100));

            // Fill bar expands from right to left
            sliderFill.style.width = `${currentProgress * 100}%`;

            // Fade out hint text as user slides
            sliderHint.style.opacity = Math.max(0, 1 - currentProgress * 2.2);

            // Calculate how far the Girl should slide left toward the Boy
            const stageWidth = hugStage.clientWidth;
            const girlWidth = girlCharacter.offsetWidth;
            const boyWidth = boyCharacter.offsetWidth;
            // Leave slight natural overlap so they stand right next to each other
            const maxGirlTravel = Math.max(0, stageWidth - girlWidth - (boyWidth * 0.68));
            const girlTranslateX = currentProgress * maxGirlTravel;

            girlCharacter.style.transform = `translateX(-${girlTranslateX}px)`;

            // Update percentage badge & heart scale
            const pct = Math.round(currentProgress * 100);
            hugPercent.textContent = `${pct}%`;
            const heartScale = 1 + (currentProgress * 0.25);
            distanceHeart.style.transform = `translateX(-50%) scale(${heartScale})`;

            // Trigger celebration pop-up once girl reaches >= 92% proximity
            if (currentProgress >= 0.92 && !hugCompleted) {
                hugCompleted = true;
                isDragging = false;
                // Snap visually to 100%
                girlCharacter.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)';
                girlCharacter.style.transform = `translateX(-${maxGirlTravel}px)`;
                hugPercent.textContent = '100%';

                setTimeout(() => {
                    girlCharacter.style.transition = '';
                    openHugModal();
                }, 260);
            }
        }

        /**
         * Handle pointer movement on the custom right-to-left slider
         */
        function handlePointerMove(clientX) {
            if (!isDragging || hugCompleted) return;

            const trackRect = sliderTrack.getBoundingClientRect();
            const thumbWidth = sliderThumb.offsetWidth;
            const padding = 6;
            const maxTravel = trackRect.width - thumbWidth - (padding * 2);

            if (maxTravel <= 0) return;

            // Right edge anchor center of the thumb at 0% progress
            const rightAnchorX = trackRect.right - padding - (thumbWidth / 2);
            const deltaFromRight = rightAnchorX - clientX;
            const progress = deltaFromRight / maxTravel;

            updateSliderVisuals(progress);
        }

        // Mouse & Touch Event Listeners for the Slider
        sliderThumb.addEventListener('pointerdown', (e) => {
            if (hugCompleted) return;
            isDragging = true;
            sliderThumb.setPointerCapture(e.pointerId);
        });

        sliderTrack.addEventListener('pointerdown', (e) => {
            if (hugCompleted) return;
            isDragging = true;
            handlePointerMove(e.clientX);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            handlePointerMove(e.clientX);
        });

        window.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;
        });

        // Keyboard accessibility for the slider
        sliderThumb.addEventListener('keydown', (e) => {
            if (hugCompleted) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                updateSliderVisuals(currentProgress + 0.12);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                updateSliderVisuals(currentProgress - 0.12);
            }
        });

        // Recalculate positions cleanly if window resizes
        window.addEventListener('resize', () => {
            if (currentSlide === 4) {
                updateSliderVisuals(currentProgress);
            }
        });

        /**
         * Open the celebratory hugging modal with floating hearts
         */
        function openHugModal() {
            spawnFloatingHearts();
            hugModal.classList.remove('opacity-0', 'pointer-events-none');
            hugModal.classList.add('opacity-100', 'pointer-events-auto');
            hugModalCard.classList.remove('scale-90');
            hugModalCard.classList.add('scale-100');
        }

        /**
         * Close the hugging modal
         */
        function closeHugModal() {
            hugModal.classList.add('opacity-0', 'pointer-events-none');
            hugModal.classList.remove('opacity-100', 'pointer-events-auto');
            hugModalCard.classList.add('scale-90');
            hugModalCard.classList.remove('scale-100');
            heartsContainer.innerHTML = '';
        }

        /**
         * Generate subtle floating heart particles inside the pop-up card
         */
        function spawnFloatingHearts() {
            heartsContainer.innerHTML = '';
            const positions = [12, 24, 38, 52, 68, 82, 90];
            positions.forEach((leftPct, index) => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-roseAccent/50';
                heart.style.left = `${leftPct}%`;
                heart.style.bottom = `${10 + (index % 3) * 12}%`;
                heart.style.animationDelay = `${index * 0.35}s`;
                heart.innerHTML = `
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                `;
                heartsContainer.appendChild(heart);
            });
        }

        /**
         * Reset entire experience back to Slide 1
         */
        function resetApp() {
            closeHugModal();
            resetSliderState();
            goToSlide(1);
        }
    </script>
</body>
</html>
